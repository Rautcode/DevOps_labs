# Layer on top of the app stack (from repo root):
#   docker compose -f 03-compose/docker-compose.yml -f 08-observability/compose.observability.yml --env-file .env up -d
services:
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox.yml"]
    volumes: ["../08-observability/blackbox.yml:/etc/blackbox.yml:ro"]
    networks: [backend]
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../08-observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../08-observability/rules.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    networks: [backend]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin   # lab only. Never do this in production.
    volumes:
      - ../08-observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../08-observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [backend]
volumes:
  prom-data:
