# Run from the repo root:
#   cp .env.example .env && docker compose -f 03-compose/docker-compose.yml --env-file .env up --build -d
name: devlab
services:
  api:
    build: { context: ../app/api, dockerfile: ../../02-containers/Dockerfile.api }
    image: devlab-api:lab
    init: true                      # proper PID 1: reaps zombies, forwards signals
    environment:
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?copy .env.example to .env}
      TRUST_PROXY: "1"
    volumes: [api-data:/data]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }
    networks: [backend]

  web:
    build: { context: .., dockerfile: 02-containers/Dockerfile.web }
    image: devlab-web:lab
    ports: ["8080:8080"]
    environment: { API_UPSTREAM: "api:5000" }
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

volumes:
  api-data:
networks:
  backend:
