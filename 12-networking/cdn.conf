# An "edge" cache (what a CDN does): serve repeat requests from its own copy, ask the origin only on a miss.
proxy_cache_path /var/cache/nginx keys_zone=edge:10m max_size=50m inactive=60m;

server {
  listen 80;
  location / {
    proxy_pass http://lab-origin;       # the origin server
    proxy_cache edge;                   # keep copies in the "edge" cache
    proxy_cache_valid 200 30s;          # a copy of a 200 response is good for 30 seconds (the TTL)
    add_header X-Cache-Status $upstream_cache_status always;   # MISS, HIT or EXPIRED: shows what happened
  }
}
