# HTTPS (TLS termination): nginx holds the certificate and talks encrypted to the client.
server {
  listen 443 ssl;
  ssl_certificate     /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;       # old SSL/TLS 1.0/1.1 are disabled on purpose
  default_type text/plain;
  location / { return 200 "secure hello over TLS\n"; }
}
