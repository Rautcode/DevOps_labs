# Load balancer: nginx spreads requests over two backends (round-robin) and skips a dead one.
upstream backend {
  zone backend 64k;   # shared memory: without it each nginx worker process round-robins on its own,
                       # so requests would NOT alternate evenly between the backends
  server lab-a:80;
  server lab-b:80;
}
server {
  listen 80;
  location / {
    proxy_pass http://backend;
    proxy_next_upstream error timeout http_502;   # if one backend fails, try the other
  }
}
