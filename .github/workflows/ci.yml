# Copy to .github/workflows/ci.yml to activate. Runs on every push / PR.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read          # least privilege for the default token
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app/api }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/api/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: { dockerfile: 02-containers/Dockerfile.api }
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: { dockerfile: 02-containers/Dockerfile.web }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: app/api, file: 02-containers/Dockerfile.api, load: true, tags: "devlab-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: 02-containers/Dockerfile.web, load: true, tags: "devlab-web:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      # Trivy is run straight from its container image. (The third-party trivy-action tag we first used
      # disappeared from GitHub and broke the whole job: a good reason to depend on as little as you can,
      # and to pin what you do use.)
      - name: Scan the images (fail on fixable HIGH/CRITICAL)
        run: |
          for i in api web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.58.0 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet "devlab-$i:ci"
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }          # gitleaks scans history
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: 1.9.8 }
      - name: fmt + validate + test
        working-directory: 05-terraform/modules/storage
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false
          terraform validate
          terraform test
      - name: Kubernetes manifests valid
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for o in dev prod; do kubectl kustomize 06-kubernetes/overlays/$o | ./kubeconform -strict -summary -; done
