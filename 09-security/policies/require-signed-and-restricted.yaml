# Kyverno admission policies (install: https://kyverno.io). The cluster itself rejects bad workloads.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: no-latest-no-root }
spec:
  validationFailureAction: Enforce
  rules:
    - name: pin-image-tag
      match: { any: [{ resources: { kinds: [Pod] } }] }
      validate:
        message: "Images must use an explicit tag other than :latest."
        pattern: { spec: { containers: [{ image: "!*:latest" }] } }
    - name: run-as-non-root
      match: { any: [{ resources: { kinds: [Pod] } }] }
      validate:
        message: "Pods must set runAsNonRoot: true."
        pattern: { spec: { =(securityContext): { =(runAsNonRoot): true } } }
