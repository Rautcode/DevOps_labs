# Copy to .github/workflows/ci.yml to activate. Runs on every push / PR.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read          # least privilege for the default token
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/api/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: 02-containers/Dockerfile.api }
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: 02-containers/Dockerfile.web }
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v6
        with: { context: app/api, file: 02-containers/Dockerfile.api, load: true, tags: "devlab-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build web
        uses: docker/build-push-action@v6
        with: { context: ., file: 02-containers/Dockerfile.web, load: true, tags: "devlab-web:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Scan api image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "devlab-api:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - name: Scan web image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "devlab-web:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - name: fmt + validate + test
        working-directory: 05-terraform/modules/storage
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false
          terraform validate
          terraform test
      - name: Kubernetes manifests valid
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for o in dev prod; do kubectl kustomize 06-kubernetes/overlays/$o | ./kubeconform -strict -summary -; done
