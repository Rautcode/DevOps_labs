# Copy to .github/workflows/release.yml. Trigger: git tag v1.2.3 && git push --tags
# Builds, pushes to GitHub Container Registry, attaches an SBOM + provenance, signs with cosign (keyless OIDC).
name: release
on:
  push: { tags: ["v*.*.*"] }
permissions:
  contents: read
  packages: write        # push to ghcr.io
  id-token: write        # keyless signing via GitHub OIDC (no long-lived keys!)
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: app/api, file: 02-containers/Dockerfile.api }
          - { name: web, context: ".",    file: 02-containers/Dockerfile.web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with: { images: "ghcr.io/${{ github.repository_owner }}/devlab-${{ matrix.name }}", tags: "type=semver,pattern={{version}}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image by digest
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/devlab-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
