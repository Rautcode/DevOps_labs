# Copy to .github/workflows/release.yml. Trigger: git tag v1.2.3 && git push --tags
# Builds, pushes to GitHub Container Registry, attaches an SBOM + provenance, signs with cosign (keyless OIDC).
name: release
on:
  push: { tags: ["v*.*.*"] }
permissions:
  contents: read
  packages: write        # push to ghcr.io
  id-token: write        # keyless signing via GitHub OIDC (no long-lived keys!)
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: app/api, file: 02-containers/Dockerfile.api }
          - { name: web, context: ".",    file: 02-containers/Dockerfile.web }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with: { images: "ghcr.io/${{ github.repository_owner }}/devlab-${{ matrix.name }}", tags: "type=semver,pattern={{version}}" }
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image by digest
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/devlab-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
