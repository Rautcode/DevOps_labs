# A Job runs a task to completion (once), unlike a Deployment which keeps something running.
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  backoffLimit: 2          # retry up to 2 times if the container fails
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hello
          image: busybox:1.36
          command: ["sh", "-c", "echo hello from a job"]
