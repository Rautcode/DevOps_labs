# An Ingress: HTTP routing rules. Requests for host devlab.localhost go to the devlab-web Service.
# The Ingress controller (Traefik, built into k3s) reads these rules and does the actual routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devlab
  namespace: devlab-dev
spec:
  rules:
    - host: devlab.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devlab-web
                port:
                  number: 80
