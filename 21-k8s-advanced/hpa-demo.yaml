# A deployment that burns CPU on purpose, plus a HorizontalPodAutoscaler that adds copies when usage is high.
# The HPA reads usage from metrics-server and compares it with the CPU REQUEST (100m): 50% target = 50m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burner
spec:
  replicas: 1
  selector:
    matchLabels: { app: burner }
  template:
    metadata:
      labels: { app: burner }
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests: { cpu: 100m }
            limits: { cpu: 200m }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: burner
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: burner }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
