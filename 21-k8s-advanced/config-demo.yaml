# Configuration kept OUT of the image: a ConfigMap used as an environment variable AND as a file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  greeting: "hello from configmap"
  APP_MODE: "learning"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "600"]
      env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef: { name: app-config, key: APP_MODE }
      volumeMounts:
        - { name: cfg, mountPath: /etc/app }
  volumes:
    - name: cfg
      configMap: { name: app-config }
