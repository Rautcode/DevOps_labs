# SQLite = one writer with state on disk -> StatefulSet with ONE replica + PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-api
  labels: { app.kubernetes.io/name: {{ .Release.Name }}-api, app.kubernetes.io/managed-by: {{ .Release.Service }} }
spec:
  serviceName: {{ .Release.Name }}-api
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Release.Name }}-api }
      annotations:
        # Roll the pod when the secret values change (a common Helm pattern)
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 5000 }]
          env:
            - { name: DATA_DIR, value: /data }
            - { name: TRUST_PROXY, value: "1" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: JWT_SECRET } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: ADMIN_PASSWORD } } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /healthz, port: http }, failureThreshold: 30, periodSeconds: 2 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.api.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app.kubernetes.io/name: {{ .Release.Name }}-api }
  ports: [{ name: http, port: 5000, targetPort: http }]
