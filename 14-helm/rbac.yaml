# RBAC = Role-Based Access Control: WHO may do WHAT to WHICH resources.
# A "viewer" account that may only read pods in this one namespace. Nothing else.
# Apply with:  kubectl apply -n devlab-helm -f 14-helm/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-pod-reader
subjects:
  - kind: ServiceAccount
    name: viewer
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
