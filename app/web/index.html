<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevLab sample site</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #1b1f24; }
    h1 { margin-bottom: .25rem } .muted { color: #57606a }
    form { display: grid; gap: .75rem; margin-top: 1.5rem }
    input, textarea, button { font: inherit; padding: .6rem; border: 1px solid #c9d1d9; border-radius: 6px }
    button { background: #1f6feb; color: #fff; border: 0; cursor: pointer }
    #status { margin-top: 1rem; font-weight: 600 }
  </style>
</head>
<body>
  <h1>DevLab sample site</h1>
  <p class="muted">A tiny web + API app to practise DevOps on. API health: <span id="health">checking…</span></p>
  <form id="lead">
    <input name="name" placeholder="Your name" required>
    <input name="email" type="email" placeholder="Email" required>
    <textarea name="message" rows="3" placeholder="Message"></textarea>
    <button>Send inquiry</button>
  </form>
  <div id="status" role="status"></div>
  <script>
    fetch('/healthz').then(r => r.json()).then(d => health.textContent = d.ok ? 'ok' : 'down').catch(() => health.textContent = 'down');
    lead.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/inquiries', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(lead))) });
      status.textContent = r.ok ? 'Thanks! Saved.' : 'Something went wrong (' + r.status + ').';
      if (r.ok) lead.reset();
    });
  </script>
</body>
</html>
