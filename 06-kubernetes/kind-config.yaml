# kind create cluster --name devlab --config 06-kubernetes/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:           # reach the web Service at http://localhost:8081
      - { containerPort: 30080, hostPort: 8081, protocol: TCP }
  - role: worker
  - role: worker
