apiVersion: apps/v1
kind: Deployment
metadata: { name: devlab-web, labels: { app.kubernetes.io/name: devlab-web } }
spec:
  replicas: 2
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }   # zero-downtime deploys
  selector: { matchLabels: { app.kubernetes.io/name: devlab-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: devlab-web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: devlab-web } }
      containers:
        - name: web
          image: devlab-web:lab
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # nginx's `resolver` ignores k8s search domains, so a short name ("devlab-api") will NOT resolve. Use the FQDN.
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: API_UPSTREAM, value: "devlab-api.$(POD_NAMESPACE).svc.cluster.local:5000" }
          readinessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /nginx-health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:           # nginx needs a few writable paths; everything else is read-only
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: devlab-web }
spec:
  selector: { app.kubernetes.io/name: devlab-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: devlab-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: devlab-web }
  minReplicas: 2
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: devlab-web }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: devlab-web } }
