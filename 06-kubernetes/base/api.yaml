# SQLite = a single writer with state on disk -> StatefulSet with ONE replica + PVC.
# (Scaling this to 3 replicas would give 3 separate databases. See the README exercise.)
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: devlab-api, labels: { app.kubernetes.io/name: devlab-api } }
spec:
  serviceName: devlab-api
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: devlab-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: devlab-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: devlab-api:lab
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 5000 }]
          env:
            - { name: DATA_DIR, value: /data }
            - { name: TRUST_PROXY, value: "1" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: devlab-secrets, key: JWT_SECRET } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: devlab-secrets, key: ADMIN_PASSWORD } } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /healthz, port: http }, failureThreshold: 30, periodSeconds: 2 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: devlab-api }
spec:
  selector: { app.kubernetes.io/name: devlab-api }
  ports: [{ name: http, port: 5000, targetPort: http }]
