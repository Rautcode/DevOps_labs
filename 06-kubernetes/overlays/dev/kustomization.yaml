apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devlab-dev
resources: [../../base, namespace.yaml]
# LAB ONLY secrets. In real life: External Secrets / Sealed Secrets / SOPS, never literals in git.
secretGenerator:
  - name: devlab-secrets
    literals: [JWT_SECRET=lab-only-jwt-secret-change-me-0123456789abcdef, ADMIN_PASSWORD=lab-admin-password]
generatorOptions: { disableNameSuffixHash: true }
patches:
  - target: { kind: Service, name: devlab-web }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30080 }
